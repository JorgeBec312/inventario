<!DOCTYPE html>

<html lang="es"><!--lang = hace referencia al idioma, meta viewport hace que se acomode automaticamente la paigna a la pantalla-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar secion inventario ADSO</title>
    <link href="css/estilos.css" rel="stylesheet"><!--llama los estilos personalizados--> 
</head>
<body class="login-fondo">
    
    <main class="login-card"><!--main se usa para el contenido princial de la pagina-->
        <header class="login-encabezado"><!--encabezado del  login-->
            <!--el icono de la tienda-->
            <i class="bi bi-shop display-4 text-sena"></i>
            <h1 class="h3 fw-bold">Inventario Sena</h1>
            <p class="text-secundary mb-0">Ingresa tus credenciales para continuar</p>
        </header>

        <form action="dashboard.html" method="get"><!--Form permite crear el contenido de un formulario cuando se envia 
                nos lleva a la ruta, el method nos envia la informacion con get-->

                <div class="form-floating mb-3"><!--permite agrupar un contenido en un contenedor-->
                    <!--es una etiqueta de texto que con el for conecta con el input-->
                    <input type="email" class="form-control" id="correo" placeholder="sena@correo.com" required><!--type obliga que tenga el @, 
                    placeholder es el texto de ejemplo-->
                    <label for="correo"><i class="bi bi-envelope me-1"></i>Correo electronico</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="clave" placeholder="Minimo 6 caracteres" minlength="6" required><!--type password oculta 
                    lo que se escribe, minlength exige los caracteres minimos-->
                    <label for="clave"><i class="bi bi-lock m-1"></i> contraseña</label>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check"> 
                    <input class="form-check-input" type="checkbox" id="recordar"><!--type cehckbox es casilla de verificacion-->
                    <label class="form-check-label" for="recordar">recordarme</label>
                </div>
                <a href="#" class="small text-decoration-none">Olvido su contraseña</a>
            </div>
                <button type="submit" class="btn btn-sena w-100 py-2 fw-semibold">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Ingresar
                </button><!--envia el formulario antes revisa los campos requeridos-->
        </form><!--cierra el formulario-->

        <p class="login-pie">¿No tienes cuenta? <a href="registro.html" class="text-decoration-none">Registrate</a></p>
        <footer class="login-pie">2026 Sena-ADSO Mixto</footer><!--pie de pagina-->

    </main>

</body>
</html>
