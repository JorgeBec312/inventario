<!DOCTYPE html>

<html lang="es"><!--lang = hace referencia al idioma, meta viewport hace que se acomode automaticamente la paigna a la pantalla-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar secion inventario ADSO</title>
    <!--CSS de bootstrap 5.3.3 desde url predeterminada-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"  rel="stylesheet">
    <link href="css/estilos.css" rel="stylesheet"><!--llama los estilos personalizados--> 
</head>
<body class="bg-body-tertiary">
    <!--menu lateral-->
    <!--offcanvas en pantallas menores al lg es un panel oculto que se deslizas-->
    <!--desde el lg se muestra normal. offcanvas-starts lo que hace salir por la izaquierda .sidebar es muestra la clase el id usa el boton q lo abre-->

    <aside class="offclass-lg offcanvas-start sidebar"
    tabindex="-1" id="menuLateral" arial-labelledby="tituloMenu">
     <!--Encabezado del panel; bootstrap solo lo muestra en celular-->
     <div class="offcanvas-header border-bottom border-secondary">
        <!--Nombre del sistema en el panel movil-->
        <h5 class="offcanvas-title" id="tituloMenu"><i class="bi bi-shop me-2"></i>Tienda sena</h5>
        <!--Boton x blanco de cierrre del panel-->
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" data-bs-target="#menuLateral" 
        arial-label="Cerrar menu"></button>
        <!--Cierra el encabezado movil-->
     </div>
     <!--Cuerpo del menu flexbox en columan para apilar logo enlaces y boton de salida-->
     <div class="offcanvas-body d-flex-column p-3">
        <!--logo que solo se ve en computador-->
        <a href="dashboard.html" class="d-none d-lg-flex align-items-center mb-3 text-white text-decoration-none fs-5 fw-bold">
            <!--icono verde y nombre-->
            <i class="bi bi-shop me-2 text-sena">Tienda sena</i>
            <!--cierra logo-->
        </a>
     </div>

    </aside>
</body>
</html>
